name: CI

on:
  pull_request:
    branches:
      - "**"

jobs:
  linting-and-testing:
    name: Do linting and testing
    runs-on: ubuntu-latest
    env:
      # Exposed through the job environment so the steps below can tell whether a
      # key is available at all: Dependabot-triggered runs read from the separate
      # Dependabot secret store and therefore see this as an empty string.
      KENALL_API_KEY: ${{ secrets.KENALL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          set -xe
          npm run lint
          npm run check-format
      
      - name: Test
        run: |
          npm run test

      - name: Build
        run: |
          npm run build

      - name: Build the examples
        run: |
          set -xe
          for example in cjs esm typescript-cjs typescript-esm; do
            (
              cd "examples/${example}"
              npm i
              if [ -f tsconfig.json ]; then
                npm run build
              fi
            )
          done

      # These hit the live API, so they can only run when a key is available.
      - name: Run the examples against the live API
        if: env.KENALL_API_KEY != ''
        run: |
          set -xe
          for example in cjs esm typescript-cjs typescript-esm; do
            (cd "examples/${example}" && node index.js)
          done

